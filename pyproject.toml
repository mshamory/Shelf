[project]
name = "shelf"
version = "0.1.0"
description = "Self-hosted reader for local WACZ archives of web novels, with NovelUpdates metadata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.34",
    "sqlmodel>=0.0.50",
    "pydantic-settings>=2.16.3",
    "warcio>=1.7.4",
    "trafilatura>=2.0",
    "selectolax>=1.0",
    "nh3>=0.3.8",
    "httpx>=0.27",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.6"]

[project.scripts]
shelf = "shelf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
