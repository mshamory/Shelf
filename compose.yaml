services:
  shelf:
    build: .
    image: ${SHELF_IMAGE:-ghcr.io/mshamory/shelf:latest}
    container_name: shelf
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Your WACZ archives (read-only is fine if you disable uploads).
      - ./library:/library
      # Database and downloaded covers.
      - ./data:/data
    environment:
      SHELF_SCAN_ON_STARTUP: "true"
      SHELF_ALLOW_UPLOADS: "true"
      SHELF_FETCH_COVERS: "true"
      # Require a password (see "Signing in" in the README).
      # SHELF_PASSWORD: "change me"
      # Or let a login proxy sign you in: the header it sets, and where it connects from.
      # SHELF_AUTH_HEADER: "Remote-User"
      # SHELF_TRUSTED_PROXIES: "172.16.0.0/12"
