name: Release

# Push a tag like v0.3.0 (matching the version in pyproject.toml and src/shelf/__init__.py)
# to publish a GitHub release with the wheel, source archive and browser extension.
# The container image for the tag is published by docker.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Check the version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(uv version --short)
          package=$(sed -nE 's/^__version__ = "(.*)"/\1/p' src/shelf/__init__.py)
          if [ "$tag" != "$project" ] || [ "$tag" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, pyproject.toml $project and __init__.py $package differ"
            exit 1
          fi
      - run: uv build
      - name: Package the browser extension
        run: cd src/shelf/extension && zip -qr "$GITHUB_WORKSPACE/dist/shelf-capture-${GITHUB_REF_NAME}.zip" . -x '*/__pycache__/*'
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shelf:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "Shelf $GITHUB_REF_NAME" \
            --notes "Container image: \`docker pull $image\`" \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
